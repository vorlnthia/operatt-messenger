name: Operatt Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure private release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OPERATT_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPERATT_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPERATT_SIGNING_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure the three Operatt signing repository secrets before running a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > operatt-release.jks
          chmod 600 operatt-release.jks
          printf 'keystore=operatt-release.jks\nkeystore.password=%s\nkeystore.alias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > signing.properties
          chmod 600 signing.properties

      - name: Build signed APK and Google Play bundle
        run: bash gradlew assembleConversationsFreeRelease bundleConversationsPlaystoreRelease --stacktrace

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operatt-messenger-signed-release
          path: |
            build/outputs/apk/conversationsFree/release/*.apk
            build/outputs/bundle/conversationsPlaystoreRelease/*.aab
          if-no-files-found: error
          retention-days: 14
